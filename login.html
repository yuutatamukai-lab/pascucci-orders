<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>PASCUCCI ログイン</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#c40000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PASCUCCI">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      background: #e0e0e0;
      padding: 16px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 420px;
      min-width: 280px;
      text-align: center;
      background: #fff;
      padding: 48px 24px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .company {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #c40000;
    }

    .subtitle {
      font-size: 20px;
      color: #666;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      font-size: 18px;
      padding: 14px;
      box-sizing: border-box;
    }

    button {
      font-size: 18px;
      padding: 14px;
      cursor: pointer;
    }

    #msg {
      min-height: 24px;
      color: red;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="company">PASCUCCI</div>
    <div class="subtitle">ログイン</div>

    <input id="email" type="email" placeholder="メールアドレス" autocomplete="username">
    <input id="password" type="password" placeholder="パスワード" autocomplete="current-password">
    <label style="text-align:left; font-size:14px; color:#666;">
      <input id="rememberEmail" type="checkbox"> メールアドレスを記憶する
    </label>
    <select id="startPage">
      <option value="auto">自動判定（推奨）</option>
      <option value="order">店舗発注画面</option>
      <option value="central_kitchen">倉庫・CK画面</option>
      <option value="master">マスター画面</option>
    </select>

    <button id="loginBtn">ログイン</button>
    <button id="installBtn">📱 アプリとして利用する</button>
    <div id="iosGuide" style="display:none; text-align:left; font-size:14px; color:#444; border:1px solid #ddd; padding:12px; border-radius:8px; margin-top:8px;">
      <strong>iPhoneでアプリとして利用する方法</strong><br><br>
      ① Safariの共有ボタンをタップ<br>
      ② 「ホーム画面に追加」を選択<br>
      ③ 「追加」をタップ
    </div>
    <div id="msg"></div>
  </div>

  <script type="module">
    import { supabase } from "./supabase-client.js";

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const rememberEmail = document.getElementById("rememberEmail");
    const startPage = document.getElementById("startPage");
    const loginBtn = document.getElementById("loginBtn");
    const msg = document.getElementById("msg");

    const savedEmail = localStorage.getItem("savedEmail");
    if (savedEmail) {
      emailInput.value = savedEmail;
      rememberEmail.checked = true;
    }
    const savedStartPage = localStorage.getItem("startPage");
    if (savedStartPage) {
      startPage.value = savedStartPage;
    }

    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();

      if (!session?.user) return;

      const { data: userRow } = await supabase
        .from("users")
        .select("role, store_id")
        .eq("id", session.user.id)
        .single();

      if (!userRow) return;

      routeUser(userRow);
    }

    function routeUser(user) {
      const preferredPage = localStorage.getItem("startPage") || "auto";

      if (preferredPage === "order") {
        location.replace("./order.html");
        return;
      }

      if (preferredPage === "central_kitchen") {
        location.replace("./central_kitchen.html");
        return;
      }

      if (preferredPage === "master") {
        location.replace("./master.html");
        return;
      }

      // master（集計・マイナス処理専用）
      if (user.role === "wh" && user.store_id === "master") {
        location.replace("./master.html");
        return;
      }

      // wh（central_kitchen / storage_shed 共通画面）
      if (user.role === "wh" && user.store_id !== "master") {
        location.replace("./central_kitchen.html");
        return;
      }

      // 店舗
      if (user.store_id && user.role !== "wh") {
        location.replace("./order.html");
        return;
      }

      msg.textContent = "不明な権限です。管理者に連絡してください。";
    }

    async function handleLogin() {
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value.trim();
      if (rememberEmail.checked) {
        localStorage.setItem("savedEmail", email);
      } else {
        localStorage.removeItem("savedEmail");
      }
      localStorage.setItem("startPage", startPage.value);

      msg.textContent = "";
      loginBtn.disabled = true;
      loginBtn.textContent = "ログイン中...";

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          msg.textContent = "ログインに失敗しました";
          return;
        }

        const { data: userRow } = await supabase
          .from("users")
          .select("role, store_id")
          .eq("id", data.user.id)
          .single();

        if (!userRow) {
          msg.textContent = "権限情報が見つかりません。管理者に連絡してください。";
          return;
        }

        routeUser(userRow);

      } catch (err) {
        msg.textContent = "通信エラーが発生しました";
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "ログイン";
      }
    }

    checkSession();
    loginBtn.addEventListener("click", handleLogin);
  </script>
  <script>
  let deferredPrompt;

  const installBtn = document.getElementById("installBtn");
  const iosGuide = document.getElementById("iosGuide");

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isInStandaloneMode = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

  if (isInStandaloneMode) {
    installBtn.style.display = "none";
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => console.log("Service Worker registered"))
        .catch(err => console.error("Service Worker registration failed:", err));
    });
  }

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
  });

  installBtn.addEventListener("click", async () => {
    if (isIOS) {
      iosGuide.style.display = iosGuide.style.display === "none" ? "block" : "none";
      return;
    }

    if (!deferredPrompt) {
      alert("この端末ではまだインストール条件を満たしていません。ページを再読み込みしてお試しください。");
      return;
    }

    deferredPrompt.prompt();

    const { outcome } = await deferredPrompt.userChoice;

    if (outcome === "accepted") {
      installBtn.style.display = "none";
    }

    deferredPrompt = null;
  });

  window.addEventListener("appinstalled", () => {
    installBtn.style.display = "none";
    iosGuide.style.display = "none";
    console.log("PWA installed");
  });
  </script>
</body>
</html>
